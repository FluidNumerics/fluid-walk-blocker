name: CI

on:
  push:
    branches: [main]
  # No branch filter: a `branches:` filter here matches the PR's BASE, not
  # its head, so a stacked PR would match nothing and run nothing.
  pull_request:

jobs:
  test:
    # Rocky Linux 9, not the Ubuntu default: its /bin/sh is bash, distinct
    # from dash, so the shell tests can exercise both. Its distro python3
    # is 3.9, which is the node floor (ADR-0015); the matrix interpreters
    # come from uv.
    runs-on: ubuntu-latest
    container: rockylinux:9
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      # The container runs as root, which would make every ownership and
      # permission test vacuous. The suite runs as a real unprivileged user.
      - name: Install git, python3, dash, and a non-root test user
        run: |
          dnf install -y epel-release
          dnf install -y git python3 dash shadow-utils
          useradd -m ciuser

      - uses: actions/checkout@v4

      - name: Hand the workspace to the non-root test user
        run: chown -R ciuser:ciuser "$GITHUB_WORKSPACE" /home/ciuser

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the test suite as the non-root user
        run: |
          runuser -u ciuser -- env \
            HOME=/home/ciuser \
            PATH="$PATH" \
            UV_PYTHON="$UV_PYTHON" \
            UV_CACHE_DIR=/home/ciuser/.cache/uv \
            uv run --group dev pytest tests/ -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4

      - name: pymarkdownlnt
        run: |
          uvx --from pymarkdownlnt==0.9.39 pymarkdown --config .pymarkdown \
            scan README.md CLAUDE.md docs/*.md docs/adr/*.md

      - name: yamllint
        run: uvx yamllint==1.38.0 -c .yamllint .github/workflows/ci.yml

      - name: vermin (node code parses on Python 3.9)
        # Everything under node/ and every .py in the payload runs on the
        # node's own interpreter (ADR-0015). vermin only reads Python, so the
        # shell scripts in the same directories are passed over, not parsed.
        run: |
          uvx vermin==1.8.0 --target=3.9- --violations --no-tips \
            node examples/payload/*.py examples/payload/shim

  ip-hygiene:
    # Two lists (tools/README-ip-gate.md): structural patterns committed in
    # the repo, customer terms supplied ONLY as a secret. The term list is
    # written to a 0600 file under RUNNER_TEMP for the duration of the job and
    # removed in an always() step. The scanner reports customer hits by
    # position only and --quiet hides even structural matches, so nothing
    # derived from the secret reaches the log. A fork PR gets no secrets: the
    # job then exits 3 and fails loudly rather than passing structurally.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Materialise the customer term list
        id: terms
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
        run: |
          set -u
          umask 077
          f=$(mktemp -p "$RUNNER_TEMP" terms.XXXXXX)
          printf '%s\n' "$FORBIDDEN_TERMS" > "$f"
          [ -s "$f" ] || { echo "FORBIDDEN_TERMS is empty or unavailable" >&2; exit 3; }
          echo "path=$f" >> "$GITHUB_OUTPUT"

      - name: Scan the tracked tree
        env:
          TERMS: ${{ steps.terms.outputs.path }}
        run: python3 tools/check_no_site_literals.py --require-terms --quiet --terms "$TERMS"

      - name: Destroy the term list
        if: always()
        env:
          TERMS: ${{ steps.terms.outputs.path }}
        run: rm -f "$TERMS"

  build-check:
    # `examples/payload/` is a build product (ADR-0013): `--check` is the
    # oracle for staleness, and two builds into fresh directories must be
    # byte-identical or the oracle is not one. The placeholder grep skips
    # the verbatim prose, where ADR-0013 names the `@@KEY@@` convention.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4

      - name: Two builds of the example site are byte-identical
        run: |
          uv run walk-blocker build --site examples/site.example.toml --out "$RUNNER_TEMP/a"
          uv run walk-blocker build --site examples/site.example.toml --out "$RUNNER_TEMP/b"
          diff -r "$RUNNER_TEMP/a" "$RUNNER_TEMP/b"

      - name: The committed example payload is current
        run: |
          uv run walk-blocker build --site examples/site.example.toml \
            --out examples/payload --check

      - name: No unfilled placeholder in any generated file
        run: |
          ! grep -r '@@' examples/payload --exclude-dir=docs --exclude=README.md

  # Report-only, on purpose. A GitHub runner is a machine class nobody has
  # characterised: the budgets a site records are calibrated against its own
  # node -- its load, its mount table -- and a ceiling chosen blind for this
  # runner would be a guess dressed as a gate. A gate that flakes trains
  # people to re-run CI until it is green, which is worse than no gate in a
  # repo whose CI is green and trusted.
  #
  # So this runs the shim-vs-shim ratio comparison and PRINTS it. No ceilings
  # are passed, nothing fails the build, and after a run of PRs there is a
  # record of what this machine class actually does -- the measurement
  # campaign that has to happen before a threshold can be chosen (ADR-0015,
  # "Re-measure when"). Until then this job's only product is its log.
  #
  # Pull requests only: on a push to main there is no base to compare against.
  measure:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      # The whole history, because the comparison needs the merge base's
      # tree. The default shallow clone has no such commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4

      - name: Build the example site at the merge base and at HEAD
        # The shim is a build product (ADR-0013), so the reference is BUILT
        # from the merge base's tree rather than extracted with `git show`:
        # a change to the template, the rule table or the renderer moves the
        # shim without touching any committed file named guard.sh. The HEAD
        # build is byte-identical to examples/payload/shim/guard.sh whenever
        # build-check is green; building it here keeps both halves of the
        # ratio coming from the same step.
        run: |
          set -u
          base=$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)
          echo "merge base: $base"
          git worktree add --detach "$RUNNER_TEMP/base-src" "$base"
          (cd "$RUNNER_TEMP/base-src" && uv run walk-blocker build \
            --site examples/site.example.toml --out "$RUNNER_TEMP/base")
          uv run walk-blocker build \
            --site examples/site.example.toml --out "$RUNNER_TEMP/head"

      - name: shim-vs-shim ratio against the merge base
        # Never fails the build -- see the comment above. A run with too few
        # usable pairs also exits non-zero, and on a shared runner that is a
        # statement about the runner rather than about this PR.
        #
        # Both shims are copied to one local directory first: measure.sh
        # refuses a guard on a network filesystem, and two halves side by
        # side on the same disk is what a ratio between them assumes anyway.
        # The build writes the mode; chmod is belt-and-braces against a copy
        # that lost it, so the exec-bit diagnosis is never this job's output.
        run: |
          set -u
          work=$(mktemp -d)
          cp "$RUNNER_TEMP/base/shim/guard.sh" "$work/guard-base.sh"
          cp "$RUNNER_TEMP/head/shim/guard.sh" "$work/guard-head.sh"
          chmod +x "$work/guard-base.sh" "$work/guard-head.sh"
          sh node/shim/measure.sh --against \
            "$work/guard-base.sh" "$work/guard-head.sh" 50 4
