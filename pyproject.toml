[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "walk-blocker"
dynamic = ["version"]
description = "Config-driven guardrails against unbounded filesystem walks on shared HPC login nodes"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "Fluid Numerics LLC"}]
classifiers = [
  "Private :: Do Not Upload",
  "License :: Other/Proprietary License",
]
dependencies = [
  "jsonschema>=4.18",
  "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
walk-blocker = "walk_blocker.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pyflakes"]

[tool.hatch.version]
path = "VERSION"
pattern = "^(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+)\\s*$"

[tool.hatch.build.targets.wheel]
packages = ["src/walk_blocker"]

[tool.hatch.build.targets.wheel.force-include]
"node" = "walk_blocker/_node"
"schema" = "walk_blocker/_schema"
"VERSION" = "walk_blocker/_VERSION"

[tool.pytest.ini_options]
testpaths = ["tests"]
