[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "walk-blocker"
dynamic = ["version"]
description = "Config-driven guardrails against unbounded filesystem walks on shared HPC login nodes"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "Trevor Keller"}]
classifiers = [
  # BSD-3 licensed, but not published: nothing here has been prepared for a
  # package index, and the do-not-upload classifier keeps an accidental
  # `twine upload` from being the decision that publishes it.
  "Private :: Do Not Upload",
  "License :: OSI Approved :: BSD License",
]
dependencies = [
  "jsonschema>=4.18",
  "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
walk-blocker = "walk_blocker.cli:main"

[dependency-groups]
# pyyaml is test-only: `tests/test_ci_workflow.py` asserts the shape of the
# IP-hygiene gate, and a hand-rolled reader for that is a second, unversioned
# YAML implementation whose bugs would show up as assertions about a workflow
# that says something else. Nothing under `node/` may import it (ADR-0015).
dev = ["pytest>=8", "pyflakes", "pyyaml"]

[tool.hatch.version]
path = "VERSION"
pattern = "^(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+)\\s*$"

[tool.hatch.build.targets.wheel]
packages = ["src/walk_blocker"]

# Only tracked paths may be force-included: hatchling fails the build on a
# missing source, and an empty directory is not in git however present it is
# on one developer's disk (review round 2 on PR #1). tests/test_packaging.py
# pins that every source here is tracked.
[tool.hatch.build.targets.wheel.force-include]
"VERSION" = "walk_blocker/_VERSION"
"schema" = "walk_blocker/schema"
"node" = "walk_blocker/node"
"README.md" = "walk_blocker/README.md"
"LICENSE" = "walk_blocker/LICENSE"
"docs" = "walk_blocker/docs"

[tool.pytest.ini_options]
testpaths = ["tests"]
